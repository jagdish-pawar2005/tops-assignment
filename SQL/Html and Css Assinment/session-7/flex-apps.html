<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox App Icons Row</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 20px;
        }

        /* TASK 1: Flexbox container for horizontal app icons with equal spacing */
        .flex-container {
            display: flex;
            justify-content: space-around; /* Equal spacing between items */
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
            object-fit: cover;
        }

        .app-name {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Favorite Apps</h2>
        
        <div class="flex-container">
            <a href="https://instagram.com" target="_blank" class="app-card">
                <img class="app-icon" src="https://images.unsplash.com/photo-1611262588024-d12430b98920?auto=format&fit=crop&w=150&q=80" alt="Instagram">
                <span class="app-name">Instagram</span>
            </a>
            
            <a href="https://whatsapp.com" target="_blank" class="app-card">
                <img class="app-icon" src="https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&w=150&q=80" alt="WhatsApp">
                <span class="app-name">WhatsApp</span>
            </a>
            
            <a href="https://zomato.com" target="_blank" class="app-card">
                <img class="app-icon" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=150&q=80" alt="Zomato">
                <span class="app-name">Zomato</span>
            </a>
            
            <a href="https://spotify.com" target="_blank" class="app-card">
                <img class="app-icon" src="https://images.unsplash.com/photo-1614680376593-902f74fa0d41?auto=format&fit=crop&w=150&q=80" alt="Spotify">
                <span class="app-name">Spotify</span>
            </a>
        </div>
    </div>
</body>
</html>
