<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- TASK 1: Meta Viewport Tag for mobile-responsive scaling and viewport viewport configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Viewport Product Card</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 1px solid #e0e0e0;
            max-width: 450px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .img-placeholder {
            width: 100%;
            height: 220px;
            background-color: #f7f9fa;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #878787;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 18px;
            margin: 0 0 10px 0;
            color: #212121;
        }

        .price-row {
            margin: 10px 0;
        }

        .price {
            font-size: 20px;
            font-weight: 600;
        }

        .buy-btn {
            background-color: #ff9f00; /* Flipkart Orange-yellow */
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="img-placeholder">Product Image</div>
        <h2>boAt Rockerz 450 Wireless Headphone</h2>
        <div class="price-row">
            <span class="price">₹1,499</span>
        </div>
        <button class="buy-btn">BUY NOW</button>
    </div>
</body>
</html>
