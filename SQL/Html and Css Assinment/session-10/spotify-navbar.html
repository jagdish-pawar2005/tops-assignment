<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Navbar (Bootstrap)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <!-- TASK 1: Bootstrap Navbar collapsing to hamburger menu on mobile -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-secondary border-opacity-25">
        <div class="container">
            <!-- Spotify Brand Logo/Name -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-success" href="#">
                <svg style="width: 25px; height: 25px; fill: currentColor;" viewBox="0 0 24 24">
                    <path d="M12 .007C5.378.007.008 5.378.008 12s5.37 11.993 11.992 11.993c6.623 0 11.992-5.37 11.992-11.993S18.623.007 12 .007zm5.49 17.305c-.217.357-.682.47-1.04.253-2.875-1.758-6.495-2.156-10.758-1.18-.409.094-.82-.162-.914-.572-.093-.41.162-.82.571-.914 4.667-1.066 8.647-.613 11.888 1.371.358.217.47.682.253 1.04zm1.464-3.26c-.274.444-.856.59-1.3.315-3.29-2.022-8.307-2.607-12.19-1.428-.5.15-1.026-.134-1.178-.633-.15-.5.135-1.027.633-1.179 4.437-1.348 9.967-.69 13.72 1.623.444.275.59.857.315 1.302zm.126-3.41c-3.945-2.343-10.453-2.56-14.23-1.41-.605.184-1.242-.158-1.426-.763-.185-.605.157-1.242.763-1.427 4.34-1.317 11.513-1.063 16.059 1.637.544.323.72 1.034.398 1.58-.322.543-1.033.72-1.579.398z"/>
                </svg>
                Spotify
            </a>
            
            <!-- Navbar Hamburger Toggler Button -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#spotifyNavbar" aria-controls="spotifyNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Collapsible Links Container -->
            <div class="collapse navbar-collapse" id="spotifyNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" aria-current="page" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="#playlists">Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" href="#profile">Profile</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2 bg-dark border-secondary text-white rounded-pill" type="search" placeholder="Search songs..." aria-label="Search">
                    <button class="btn btn-outline-success rounded-pill px-4" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-5 text-center">
        <h4>Collape Demo</h4>
        <p class="text-secondary">Resize browser width to mobile sizes to see the menu transform into a hamburger toggle button.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
