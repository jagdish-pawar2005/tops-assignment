<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Flipkart Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5 d-flex justify-content-center">
    <!-- TASK 2: Bootstrap Card for Flipkart Product Preview -->
    <div class="card shadow-sm" style="width: 18rem; border-radius: 8px;">
        <!-- Product Image -->
        <div class="bg-secondary bg-opacity-10 py-4 text-center rounded-top">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=200&q=80" class="img-fluid" alt="Nike Running Shoe" style="max-height: 140px; object-fit: contain;">
        </div>
        
        <!-- Card Body Details -->
        <div class="card-body">
            <h6 class="text-muted small mb-1">NIKE</h6>
            <h5 class="card-title text-dark fs-6 fw-semibold text-truncate" title="Nike Air Zoom Pegasus 39 Running Shoes">Nike Air Zoom Pegasus 39</h5>
            
            <div class="d-flex align-items-center gap-2 my-2">
                <span class="badge bg-success small">4.4 ★</span>
                <span class="text-secondary small">(1,240 Ratings)</span>
            </div>
            
            <div class="my-3">
                <span class="fs-5 fw-bold text-dark">₹6,995</span>
                <span class="text-muted text-decoration-line-through small ms-2">₹10,995</span>
                <span class="text-success small fw-semibold ms-2">36% off</span>
            </div>
            
            <button class="btn btn-warning w-100 text-white fw-bold py-2 rounded-2" style="background-color: #fb641b; border-color: #fb641b;">BUY NOW</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
