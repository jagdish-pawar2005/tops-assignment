<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Review Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 500px;">
        <!-- TASK 4: Bootstrap Form for Zomato Restaurant Review -->
        <div class="card border-0 shadow rounded-3 p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-danger">Write a Review</h2>
                <p class="text-secondary small">Tell us about your culinary dining experience</p>
            </div>
            
            <form action="#" method="POST">
                <!-- Name input -->
                <div class="mb-3">
                    <label for="reviewerName" class="form-label fw-semibold text-dark">Your Name</label>
                    <input type="text" class="form-control py-2" id="reviewerName" placeholder="e.g., Rohan Verma" required>
                </div>
                
                <!-- Rating selection dropdown -->
                <div class="mb-3">
                    <label for="restaurantRating" class="form-label fw-semibold text-dark">Select Rating</label>
                    <select class="form-select py-2" id="restaurantRating" required>
                        <option value="" disabled selected>Select star rating...</option>
                        <option value="5">5 Stars (Exceptional)</option>
                        <option value="4">4 Stars (Great)</option>
                        <option value="3">3 Stars (Good)</option>
                        <option value="2">2 Stars (Average)</option>
                        <option value="1">1 Star (Poor)</option>
                    </select>
                </div>
                
                <!-- Review message -->
                <div class="mb-4">
                    <label for="reviewContent" class="form-label fw-semibold text-dark">Review Message</label>
                    <textarea class="form-control" id="reviewContent" rows="4" placeholder="How was the taste, ambiance, and service?" required></textarea>
                </div>
                
                <!-- Submit button -->
                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm">Submit Review</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
