<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Food Order Form</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .order-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 500px;
            border: 1px solid #f2f2f2;
            overflow: hidden;
        }
        .header {
            background-color: #e23744; /* Zomato Brand Red Color */
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 6px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        form {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1c1c1c;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background: #ffffff;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #e23744;
            box-shadow: 0 0 0 3px rgba(226, 55, 68, 0.15);
        }
        input:disabled {
            background-color: #f4f4f4;
            color: #8c8c8c;
            cursor: not-allowed;
            border-color: #e0e0e0;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .submit-btn {
            background-color: #e23744;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(226, 55, 68, 0.2);
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #cb202d;
        }
    </style>
</head>
<body>
    <div class="order-card">
        <div class="header">
            <h2>Zomato Order Placement</h2>
            <p>Taste the deliciousness delivered to your door</p>
        </div>
        
        <form action="#" method="POST">
            <!-- Order ID field is disabled because users should not edit unique system-generated identifiers. -->
            <div class="form-group">
                <label for="orderId">Order ID (System Generated)</label>
                <input type="text" id="orderId" name="orderId" value="ORD12345" disabled>
                <!--
                  COMMENT EXPLAINING DISABLED STATUS:
                  The 'orderId' field is marked as 'disabled' for the following reasons:
                  1. Data Integrity: The order ID is auto-generated by the database/system. Allowing users to edit or type a random order ID could cause duplicate keys or order matching issues.
                  2. Security: Prevents malicious users from spoofing order IDs or injecting arbitrary order identifiers during form submission.
                  3. User Experience: Makes it clear to the user that the reference number is fixed and they do not need to take any action or enter info there.
                -->
            </div>
            
            <div class="form-group">
                <label for="username">Customer Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="foodItem">Select Food Item</label>
                <select id="foodItem" name="foodItem" required>
                    <option value="" disabled selected>Choose an item...</option>
                    <option value="butter-chicken">Butter Chicken Combo</option>
                    <option value="paneer-tikka">Paneer Tikka Masala</option>
                    <option value="cheese-pizza">Loaded Cheese Pizza</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="1" max="20" placeholder="1" required>
            </div>
            
            <div class="form-group">
                <label for="instructions">Delivery Instructions</label>
                <textarea id="instructions" name="instructions" placeholder="e.g., Leave at the gate, don't ring the bell, ring if not answered..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Place Order</button>
        </form>
    </div>
</body>
</html>
