<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Box Model Card</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f3f3;
            margin: 40px;
            display: flex;
            justify-content: center;
        }
        
        /* TASK 1: Zomato-style card using margins, paddings, and borders */
        .card {
            background-color: #ffffff;
            width: 320px;
            
            /* Box Model Properties */
            border: 2px solid #e8e8e8; /* Visible outer border */
            border-radius: 12px;
            padding: 16px;            /* Padding inside the card */
            margin: 20px;             /* Margin around the card */
            
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
        
        .image-placeholder {
            background-color: #e23744;
            height: 150px;
            border-radius: 8px;
            margin-bottom: 12px;     /* Margin separating image from text content */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: 700;
        }

        .info-section {
            border-bottom: 1px solid #f2f2f2; /* Separating border line */
            padding-bottom: 12px;              /* Padding bottom to separate sections */
            margin-bottom: 12px;               /* Margin bottom to push next section down */
        }

        .restaurant-name {
            font-size: 20px;
            font-weight: 700;
            color: #1c1c1c;
            margin: 0 0 4px 0; /* Box Model Margin reset and offset */
        }

        .cuisine {
            font-size: 14px;
            color: #696969;
            margin: 0;
        }

        .rating-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0; /* Small vertical padding */
        }

        .rating-badge {
            background-color: #24963f;
            color: white;
            padding: 4px 8px; /* Padding inside the rating badge */
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .cost {
            font-size: 13px;
            color: #696969;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="image-placeholder">Delicious Italian</div>
        
        <div class="info-section">
            <h2 class="restaurant-name">La Dolce Vita</h2>
            <p class="cuisine">Italian, Pizza, Dessert</p>
        </div>
        
        <div class="rating-section">
            <span class="rating-badge">4.5 ★</span>
            <span class="cost">₹400 for two</span>
        </div>
    </div>
</body>
</html>
