<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Buttons (External CSS)</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        h2 {
            margin-top: 0;
            color: #1c1c1c;
            font-size: 20px;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Restaurant Actions</h2>
        <p>These actions are styled using an external stylesheet that targets the default button elements.</p>
        <div class="button-group">
            <button>Order Online</button>
            <button>Book Table</button>
        </div>
    </div>
</body>
</html>
