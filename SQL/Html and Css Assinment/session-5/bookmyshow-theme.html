<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Theme Switcher</title>
    <style>
        /* TASK 5: Default Light Theme */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #1a1a1a;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .movie-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
            padding: 24px;
            border: 1px solid #e0e0e0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .theme-btn {
            background-color: #f84464; /* BookMyShow Red */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .poster {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .info {
            font-size: 14px;
            line-height: 1.6;
        }

        .rating {
            font-weight: 700;
            color: #f84464;
            margin: 10px 0;
        }

        /* TASK 5: Define Dark Theme rules using a parent class on body */
        body.dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        body.dark-mode .movie-card {
            background-color: #1e293b;
            border-color: #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        body.dark-mode .theme-btn {
            background-color: #38bdf8; /* Blue accent in Dark Mode */
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="movie-card">
        <div class="header">
            <h2>Movie Details</h2>
            <!-- Button triggering JavaScript toggle -->
            <button class="theme-btn" id="themeToggleBtn">Switch Theme</button>
        </div>
        
        <img class="poster" src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80" alt="Cinema screen">
        
        <div class="info">
            <h3 style="margin: 10px 0 5px 0;">Interstellar</h3>
            <p style="margin: 0; opacity: 0.8;">Sci-Fi | English | 2h 49m</p>
            <div class="rating">★ 9.1/10 (350K Votes)</div>
            <p>A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival. Directed by Christopher Nolan.</p>
        </div>
    </div>

    <!-- TASK 5 JS Implementation -->
    <script>
        const toggleButton = document.getElementById('themeToggleBtn');
        
        toggleButton.addEventListener('click', () => {
            // Toggle 'dark-mode' class on the body
            document.body.classList.toggle('dark-mode');
            
            // Update button label text
            if (document.body.classList.contains('dark-mode')) {
                toggleButton.textContent = "Light Mode";
            } else {
                toggleButton.textContent = "Dark Mode";
            }
        });
    </script>
</body>
</html>
