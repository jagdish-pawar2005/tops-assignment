<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Listing Card (Semantic)</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .listing-container {
            max-width: 360px;
            width: 100%;
        }
        article {
            background-color: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e8e8e8;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        article:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .restaurant-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        header h2 {
            margin: 0;
            font-size: 18px;
            color: #1c1c1c;
            font-weight: 600;
        }
        .cuisine {
            color: #696969;
            font-size: 14px;
            margin: 5px 0 10px 0;
        }
        footer {
            border-top: 1px solid #f2f2f2;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #585858;
            font-weight: 500;
        }
        .rating {
            background-color: #24963f; /* Zomato Green for Rating */
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .delivery-time {
            color: #1c1c1c;
        }
    </style>
</head>
<body>
    <div class="listing-container">
        <!-- Semantic layout: Article containing header, core info, and footer -->
        <article>
            <img class="restaurant-img" src="https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=600&q=80" alt="Restaurant Interior Style">
            
            <div class="card-content">
                <header>
                    <h2>The Royal Feast</h2>
                    <span class="rating">4.3 ★</span>
                </header>
                
                <p class="cuisine">North Indian, Mughlai, Biryani</p>
                
                <footer>
                    <span class="delivery-time">🕒 25 mins</span>
                    <span class="price-for-two">₹350 for two</span>
                </footer>
            </div>
        </article>
    </div>
</body>
</html>
