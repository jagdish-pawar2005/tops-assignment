<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Color Utilities Restaurant List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 fw-bold text-danger">Zomato Style Colors Demo</h2>
        
        <!-- Restaurant 1 -->
        <!-- TASK 3: Using color utilities (bg-success, text-success, bg-danger-subtle, text-danger) -->
        <div class="card border-0 shadow-sm mb-3 p-3 bg-white">
            <div class="row align-items-center">
                <div class="col-8">
                    <h5 class="fw-bold text-dark mb-1">Urban Punjab</h5>
                    <p class="text-secondary small mb-2">North Indian, Mughlai</p>
                    
                    <!-- Color Utility 1: Text color success for Open status -->
                    <span class="text-success small fw-semibold d-block mb-2">● Open Now</span>
                    
                    <!-- Color Utility 2: Background sub-red and text red for Offers -->
                    <span class="badge bg-danger-subtle text-danger px-2.5 py-1.5 fw-bold rounded">
                        50% OFF up to ₹100
                    </span>
                </div>
                
                <div class="col-4 text-end">
                    <!-- Color Utility 3: Background success and text white for Rating -->
                    <div class="badge bg-success text-white fs-6 py-2 px-3 fw-bold rounded-3">
                        4.4 ★
                    </div>
                    <div class="text-secondary small mt-2">₹250 for one</div>
                </div>
            </div>
        </div>

        <!-- Restaurant 2 -->
        <div class="card border-0 shadow-sm mb-3 p-3 bg-white">
            <div class="row align-items-center">
                <div class="col-8">
                    <h5 class="fw-bold text-dark mb-1">Cafe Coffee Day</h5>
                    <p class="text-secondary small mb-2">Beverages, Desserts</p>
                    
                    <!-- Color Utility: Background sub-warning and text warning for Temporarily Closed status -->
                    <span class="badge bg-warning-subtle text-warning-emphasis px-2.5 py-1 fw-bold rounded mb-2">
                        Temporarily Closed
                    </span>
                    
                    <!-- Color Utility: Background sub-primary and text primary for loyal deals -->
                    <span class="badge bg-primary-subtle text-primary px-2.5 py-1.5 fw-bold rounded d-block w-fit">
                        Free delivery with Gold
                    </span>
                </div>
                
                <div class="col-4 text-end">
                    <!-- Color Utility: Background secondary and text white for lower rating -->
                    <div class="badge bg-secondary text-white fs-6 py-2 px-3 fw-bold rounded-3">
                        3.8 ★
                    </div>
                    <div class="text-secondary small mt-2">₹150 for one</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
