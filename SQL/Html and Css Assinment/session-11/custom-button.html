<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Override Button</title>
    
    <!-- Link Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- TASK 4: Link custom stylesheet AFTER Bootstrap CSS to override styles -->
    <link rel="stylesheet" href="custom-override.css">
</head>
<body class="bg-light py-5">
    <div class="container text-center" style="max-width: 500px;">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h4 class="fw-bold mb-3 text-dark">Book Tickets</h4>
            <p class="text-secondary small mb-4">The 'Book Ticket' button below uses Bootstrap's standard class <strong>.btn-primary</strong> but is styled with our custom BookMyShow brand red color via CSS overrides.</p>
            
            <!-- Button using .btn-primary, which is overriden by custom-override.css -->
            <button class="btn btn-primary btn-lg w-100 py-3 rounded-3">Book Ticket</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
