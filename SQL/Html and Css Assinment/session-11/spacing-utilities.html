<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 900px;">
        <h2 class="mb-4 text-center fw-bold">Bootstrap Spacing Utilities Demo</h2>
        
        <!-- TASK 1: Three different levels of spacing (margin and padding) using utility classes -->
        <div class="row g-4">
            
            <!-- LEVEL 1: Low Spacing (p-2, m-2) -->
            <div class="col-md-4">
                <div class="card border border-primary p-2 m-2">
                    <div class="bg-secondary bg-opacity-10 py-3 text-center rounded">
                        <span class="text-muted small">Shoe Pro 1</span>
                    </div>
                    <div class="card-body p-1 mt-2">
                        <h6 class="fw-bold m-0 fs-6">Nike Air Max</h6>
                        <p class="text-secondary small m-0 mt-1">Level 1 Spacing (p-2, m-2)</p>
                    </div>
                </div>
            </div>

            <!-- LEVEL 2: Medium Spacing (p-4, m-3) -->
            <div class="col-md-4">
                <div class="card border border-success p-4 m-3">
                    <div class="bg-secondary bg-opacity-10 py-3 text-center rounded">
                        <span class="text-muted small">Shoe Pro 2</span>
                    </div>
                    <div class="card-body p-2 mt-3">
                        <h6 class="fw-bold m-0 fs-6">Nike Zoom</h6>
                        <p class="text-secondary small m-0 mt-1">Level 2 Spacing (p-4, m-3)</p>
                    </div>
                </div>
            </div>

            <!-- LEVEL 3: High Spacing (p-5, m-4) -->
            <div class="col-md-4">
                <div class="card border border-danger p-5 m-4">
                    <div class="bg-secondary bg-opacity-10 py-3 text-center rounded">
                        <span class="text-muted small">Shoe Pro 3</span>
                    </div>
                    <div class="card-body p-3 mt-4">
                        <h6 class="fw-bold m-0 fs-6">Nike Pegasus</h6>
                        <p class="text-secondary small m-0 mt-1">Level 3 Spacing (p-5, m-4)</p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
