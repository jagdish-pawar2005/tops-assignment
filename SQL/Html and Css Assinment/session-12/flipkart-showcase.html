<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Showcase Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <h2 class="mb-4 fw-bold text-dark">Official Merchandise Store</h2>
        
        <!-- TASK 3: Product showcase, 4 cards on desktop (col-md-3) collapsing to 2 cards on mobile (col-6) -->
        <div class="row g-3">
            
            <!-- Card 1 -->
            <div class="col-6 col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-10 py-4 text-center rounded-top">
                        <span class="text-muted small">T-Shirt</span>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="card-title fw-bold text-dark m-0">Acoustic Dream Tee</h6>
                        <p class="text-secondary small mt-1">₹799 <span class="text-decoration-line-through text-muted small ms-1">₹1,499</span></p>
                        <button class="btn btn-warning btn-sm w-100 text-white fw-bold mt-2">Buy Now</button>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-6 col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-10 py-4 text-center rounded-top">
                        <span class="text-muted small">Hoodie</span>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="card-title fw-bold text-dark m-0">Nashville Sessions Hoodie</h6>
                        <p class="text-secondary small mt-1">₹1,899 <span class="text-decoration-line-through text-muted small ms-1">₹2,999</span></p>
                        <button class="btn btn-warning btn-sm w-100 text-white fw-bold mt-2">Buy Now</button>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-6 col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-10 py-4 text-center rounded-top">
                        <span class="text-muted small">Vinyl</span>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="card-title fw-bold text-dark m-0">Dreamscapes Vinyl LP</h6>
                        <p class="text-secondary small mt-1">₹2,499 <span class="text-decoration-line-through text-muted small ms-1">₹3,999</span></p>
                        <button class="btn btn-warning btn-sm w-100 text-white fw-bold mt-2">Buy Now</button>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="col-6 col-md-3">
                <div class="card h-100 shadow-sm border-0">
                    <div class="bg-secondary bg-opacity-10 py-4 text-center rounded-top">
                        <span class="text-muted small">Poster</span>
                    </div>
                    <div class="card-body p-3">
                        <h6 class="card-title fw-bold text-dark m-0">Autographed Gig Poster</h6>
                        <p class="text-secondary small mt-1">₹499 <span class="text-decoration-line-through text-muted small ms-1">₹999</span></p>
                        <button class="btn btn-warning btn-sm w-100 text-white fw-bold mt-2">Buy Now</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
