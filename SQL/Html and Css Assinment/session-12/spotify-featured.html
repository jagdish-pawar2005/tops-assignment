<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white py-5">
    <div class="container">
        <h2 class="mb-4 fw-bold text-success">Featured Playlists</h2>
        
        <!-- TASK 2: Three playlists in a responsive row using Bootstrap's grid system -->
        <div class="row g-4">
            
            <!-- Playlist 1 -->
            <div class="col-md-4">
                <div class="card h-100 bg-secondary bg-opacity-25 border-0 rounded-3 text-center p-3">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=350&q=80" class="card-img-top rounded-2" alt="Acoustic Chill" style="height: 200px; object-fit: cover;">
                    <div class="card-body px-0 pb-0 pt-3 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title fw-bold text-white mb-2">Acoustic Chill Sessions</h5>
                            <p class="text-secondary small card-text">Mellow acoustic tracks and indie melodies for focusing or relaxing.</p>
                        </div>
                        <button class="btn btn-success w-100 rounded-pill fw-bold mt-3">Listen Now</button>
                    </div>
                </div>
            </div>

            <!-- Playlist 2 -->
            <div class="col-md-4">
                <div class="card h-100 bg-secondary bg-opacity-25 border-0 rounded-3 text-center p-3">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=350&q=80" class="card-img-top rounded-2" alt="Late Night LoFi" style="height: 200px; object-fit: cover;">
                    <div class="card-body px-0 pb-0 pt-3 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title fw-bold text-white mb-2">Late Night Lo-Fi</h5>
                            <p class="text-secondary small card-text">Slow ambient lofi beats to wind down your day or study late.</p>
                        </div>
                        <button class="btn btn-success w-100 rounded-pill fw-bold mt-3">Listen Now</button>
                    </div>
                </div>
            </div>

            <!-- Playlist 3 -->
            <div class="col-md-4">
                <div class="card h-100 bg-secondary bg-opacity-25 border-0 rounded-3 text-center p-3">
                    <img src="https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&w=350&q=80" class="card-img-top rounded-2" alt="Midnight Driving" style="height: 200px; object-fit: cover;">
                    <div class="card-body px-0 pb-0 pt-3 d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title fw-bold text-white mb-2">Midnight Driving</h5>
                            <p class="text-secondary small card-text">High-energy indie pop and synth tracks for late-night rides.</p>
                        </div>
                        <button class="btn btn-success w-100 rounded-pill fw-bold mt-3">Listen Now</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
