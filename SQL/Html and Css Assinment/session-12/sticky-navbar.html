<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar Artist Landing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white pt-5">
    
    <!-- TASK 4: Sticky Navbar with Home, About, and Contact links -->
    <nav class="navbar navbar-expand-md navbar-dark bg-black sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="#">Melody Rivers</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active fw-medium" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content to enable scrolling -->
    <div class="container py-5 text-center" id="home" style="min-height: 100vh;">
        <h1 class="text-success mt-5 fw-bold">Home Section</h1>
        <p class="text-secondary fs-5 mt-3">Scroll down to verify that the navbar remains pinned to the top of the browser window.</p>
    </div>

    <div class="container py-5 text-center" id="about" style="min-height: 100vh; background-color: #111;">
        <h1 class="text-success mt-5 fw-bold">About Section</h1>
        <p class="text-secondary fs-5 mt-3">This section represents the artist biography and story.</p>
    </div>

    <div class="container py-5 text-center" id="contact" style="min-height: 100vh;">
        <h1 class="text-success mt-5 fw-bold">Contact Section</h1>
        <p class="text-secondary fs-5 mt-3">Reach out to management or booking services.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
